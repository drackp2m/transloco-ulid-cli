name: VS Code extension

on:
  push:
    tags: ['vscode-v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Package and validate the extension without publishing it
        type: boolean
        default: true

env:
  VSIX: transloco-ulid-i18n.vsix
  VSCE: '@vscode/vsce@4.1.1'
  OVSX: ovsx@1.4.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check the tag matches the manifest
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "vscode-v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match vscode/package.json ${version}"
            exit 1
          fi

      - name: Package
        id: package
        run: npx --yes "$VSCE" package --no-dependencies --out "$VSIX"

      - name: Publish to the VS Code Marketplace
        if: ${{ !cancelled() && steps.package.outcome == 'success' && (github.event_name == 'push' || !inputs.dry-run) }}
        run: npx --yes "$VSCE" publish --oidc --packagePath "$VSIX"

      - name: Publish to Open VSX
        if: ${{ !cancelled() && steps.package.outcome == 'success' && (github.event_name == 'push' || !inputs.dry-run) }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes "$OVSX" publish "$VSIX" --pat "$OVSX_PAT"
          else
            npx --yes "$OVSX" publish "$VSIX" --trusted-publishing
          fi
